name: manifest

# Пересобирает manifest.json (хэши файлов для автообновления TERA Toolbox) при каждом пуше в main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверка синтаксиса
        run: |
          for f in index.js settings_migrator.js lib/*.js ui/*.js tools/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"
      - name: Проверка переводов
        run: node tools/i18n-check.js
      - name: Проверка manifest.json (PR)
        if: github.event_name == 'pull_request'
        run: node tools/manifest.js --check
      - name: Обновление manifest.json (main)
        if: github.event_name == 'push'
        run: |
          node tools/manifest.js
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Обновить manifest.json [skip ci]"
            git push
          fi
